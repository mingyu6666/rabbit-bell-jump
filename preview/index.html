<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小兔跳铃铛 - 浏览器试玩版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0e2a;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #c { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 20px 0;
    display: flex; align-items: baseline; justify-content: space-between;
    pointer-events: none; z-index: 10;
  }
  #score { color: #ffd54f; font-size: 42px; font-weight: 700; text-shadow: 0 3px 10px rgba(0,0,0,.45); }
  #best { color: rgba(255,255,255,.85); font-size: 15px; text-shadow: 0 2px 8px rgba(0,0,0,.4); }
  #overlay {
    position: fixed; inset: 0;
    background: rgba(8,12,38,.55);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; cursor: pointer;
  }
  #overlay.hidden { display: none; }
  #title { color: #fff; font-size: 38px; font-weight: 700; letter-spacing: 4px; margin-bottom: 16px; text-shadow: 0 5px 18px rgba(0,0,0,.5); }
  #title.over { color: #ff8a80; }
  .sub { color: rgba(255,255,255,.9); font-size: 15px; line-height: 1.8; text-align: center; }
  #btn {
    margin-top: 30px; padding: 12px 52px;
    background: linear-gradient(135deg, #ffb300, #ff8f00);
    color: #fff; font-size: 19px; font-weight: 600;
    border-radius: 999px; box-shadow: 0 8px 26px rgba(255,143,0,.45);
  }
  #finalScore { color: #ffd54f; font-size: 34px; font-weight: 700; margin: 8px 0 12px; }
  #bestTip { color: rgba(255,255,255,.75); font-size: 14px; margin-top: 14px; }
  #hint { color: rgba(255,255,255,.45); font-size: 12px; position: fixed; bottom: 8px; width: 100%; text-align: center; z-index: 5; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="score">0</div>
  <div id="best">最高 0</div>
</div>
<div id="overlay">
  <div id="title">小兔跳铃铛</div>
  <div class="sub">按住屏幕 / 鼠标拖动，控制小兔左右移动</div>
  <div class="sub">踩中铃铛继续上升，踩空就会摔落</div>
  <div id="btn">点击开始</div>
  <div id="finalScore"></div>
  <div id="bestTip"></div>
</div>
<div id="hint">浏览器试玩版 · 与微信小程序同款逻辑（Canvas 2D）</div>

<script>
(function () {
  'use strict'

  /* ================= 浏览器适配层（替代微信 API） ================= */
  const STORAGE_KEY = 'rabbit_bell_best'
  const $ = (id) => document.getElementById(id)
  const scoreEl = $('score')
  const bestEl = $('best')
  const overlay = $('overlay')
  const titleEl = $('title')
  const finalScoreEl = $('finalScore')
  const bestTipEl = $('bestTip')
  const btnEl = $('btn')

  let audioCtx = null
  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext
      if (AC) audioCtx = new AC()
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume()
  }
  function tone(freq, t0, dur, vol) {
    if (!audioCtx) return
    const o = audioCtx.createOscillator()
    const g = audioCtx.createGain()
    o.type = 'sine'
    o.frequency.value = freq
    g.gain.setValueAtTime(vol, t0)
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur)
    o.connect(g)
    g.connect(audioCtx.destination)
    o.start(t0)
    o.stop(t0 + dur)
  }
  const sounds = {
    bell() {
      ensureAudio()
      const now = audioCtx.currentTime
      tone(1760, now, 0.18, 0.35)
      tone(2640, now, 0.12, 0.2)
    },
    star() {
      ensureAudio()
      const now = audioCtx.currentTime
      tone(1318.5, now, 0.14, 0.3)
      tone(1760, now + 0.16, 0.14, 0.3)
    },
    fail() {
      ensureAudio()
      const now = audioCtx.currentTime
      const o = audioCtx.createOscillator()
      const g = audioCtx.createGain()
      o.type = 'sine'
      o.frequency.setValueAtTime(420, now)
      o.frequency.linearRampToValueAtTime(150, now + 0.5)
      g.gain.setValueAtTime(0.3, now)
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.5)
      o.connect(g)
      g.connect(audioCtx.destination)
      o.start(now)
      o.stop(now + 0.5)
    }
  }
  function vibrate() {
    if (navigator.vibrate) {
      try { navigator.vibrate(20) } catch (e) { /* ignore */ }
    }
  }
  function loadBest() {
    try { return parseInt(localStorage.getItem(STORAGE_KEY), 10) || 0 } catch (e) { return 0 }
  }
  function saveBest(v) {
    try { localStorage.setItem(STORAGE_KEY, String(v)) } catch (e) { /* ignore */ }
  }

  /* ================= 游戏核心（与小程序 index.js 同款逻辑） ================= */
  const G = 1100
  const RABBIT_R = 16
  const FEET_R = 16
  const HIT_ZONE = 20

  function clamp(v, lo, hi) {
    return Math.max(lo, Math.min(hi, v))
  }

  const canvas = $('c')
  const ctx = canvas.getContext('2d')
  const dpr = Math.min(2, window.devicePixelRatio || 1)
  const W = window.innerWidth
  const H = window.innerHeight
  canvas.width = W * dpr
  canvas.height = H * dpr
  ctx.scale(dpr, dpr)

  const game = {
    state: 'ready',
    score: 0,
    best: loadBest(),

    /* --- 初始化 --- */
    initGame() {
      this.score = 0
      this.state = 'ready'
      this.camera = 0
      this.touching = false
      this.touchX = W / 2
      this.particles = []
      this.stars = []
      this.elapsed = 0
      this.lastStarClean = 0
      this.bgStars = []
      for (let i = 0; i < 60; i++) {
        this.bgStars.push({
          x: Math.random() * W,
          y: Math.random() * H * 4,
          r: Math.random() * 1.6 + 0.6,
          phase: Math.random() * Math.PI * 2,
          speed: Math.random() * 2 + 0.5
        })
      }
      this.clouds = [
        { x: W * 0.15, y: H * 0.2, s: 0.9, speed: 8 },
        { x: W * 0.7, y: H * 0.34, s: 1.2, speed: -6 },
        { x: W * 0.45, y: H * 0.12, s: 0.7, speed: 10 }
      ]
      this.rabbit = { x: W / 2, y: H * 0.72 - 55, vx: 0, vy: 0 }
      this.bells = []
      this.spawnStartLayer()
      for (let i = 0; i < 8; i++) this.spawnLayerAbove()
    },

    spawnStartLayer() {
      const startY = H * 0.72
      const gap = this.nextGap()
      this.bells.push({
        x: W / 2, y: startY, r: 40, scored: true, passed: false,
        hit: false, hitAt: 0, gold: false, gapNext: gap
      })
      this.lastLayerX = W / 2
    },

    spawnLayerAbove() {
      const top = this.bells[0]
      const gap = this.nextGap()
      const r = this.bellRadius()
      const newY = top.y - gap
      top.gapNext = gap

      const scoreNow = this.score
      const count = scoreNow >= 20 && Math.random() < 0.3 ? 2 : 1
      const margin = r + 16
      const maxStep = W * 0.4
      const created = []

      // 首层铃铛尽量落在兔子正上方附近，保证第一跳几乎必中（建立手感信心）
      const isFirstLayer = this.bells.length === 1
      let x0 = isFirstLayer
        ? clamp(W / 2 + (Math.random() * 2 - 1) * 40, margin, W - margin)
        : clamp(
            this.lastLayerX + (Math.random() * 2 - 1) * maxStep,
            margin,
            W - margin
          )
      created.push({
        x: x0, y: newY, r, scored: false, passed: false,
        hit: false, hitAt: 0, gold: Math.random() < 0.12, gapNext: 0
      })

      if (count === 2) {
        const gapBetween = r * 2.6 + 30
        let x2 = x0 + (Math.random() > 0.5 ? 1 : -1) * gapBetween
        x2 = clamp(x2, margin, W - margin)
        if (Math.abs(x2 - x0) < r * 2.2) x2 = clamp(W - x0, margin, W - margin)
        created.push({
          x: x2, y: newY, r, scored: false, passed: false,
          hit: false, hitAt: 0, gold: Math.random() < 0.12, gapNext: 0
        })
      }

      this.lastLayerX = x0
      this.bells.unshift.apply(this.bells, created)

      if (Math.random() < 0.45) {
        this.stars.push({
          x: clamp(Math.random() * W, 20, W - 20),
          y: (top.y + newY) / 2 + (Math.random() * 2 - 1) * 24,
          r: 12, hit: false, hitAt: 0
        })
      }
    },

    ensureLayers() {
      let guard = 0
      while (this.bells[0].y - this.camera > 60 && guard < 10) {
        this.spawnLayerAbove()
        guard++
      }
    },

    nextGap() { return Math.min(230, 120 + this.score * 1.8) },
    bellRadius() { return Math.max(20, 44 - this.score * 0.5) },

    /* --- 帧循环 --- */
    start() {
      this.lastT = 0
      const loop = (t) => {
        if (this.destroyed) return
        const dt = this.lastT ? Math.min(0.05, (t - this.lastT) / 1000) : 0.016
        this.lastT = t
        this.elapsed += dt
        this.update(dt)
        this.render(t)
        this.raf = requestAnimationFrame(loop)
      }
      this.raf = requestAnimationFrame(loop)
    },

    /* --- 更新 --- */
    update(dt) {
      if (this.state === 'ready' || this.state === 'gameover') {
        this.updateParticles(dt)
        return
      }

      if (this.touching) {
        const prevX = this.rabbit.x
        this.rabbit.x += (this.touchX - this.rabbit.x) * Math.min(1, 20 * dt)
        this.rabbit.vx = (this.rabbit.x - prevX) / Math.max(dt, 0.001)
      } else {
        this.rabbit.vx = 0
      }
      this.rabbit.x = clamp(this.rabbit.x, 24, W - 24)

      this.rabbit.vy += G * dt
      this.rabbit.y += this.rabbit.vy * dt

      const feetY = this.rabbit.y + RABBIT_R * 0.9
      for (const b of this.bells) {
        if (b.scored || b.passed || b.hit) continue
        const d = feetY - b.y
        if (d >= 0 && d <= HIT_ZONE && this.rabbit.vy > 0) {
          if (Math.abs(this.rabbit.x - b.x) <= b.r + FEET_R) {
            this.hitBell(b)
          } else if (d >= HIT_ZONE - 2) {
            b.passed = true
          }
        }
      }

      for (const s of this.stars) {
        if (s.hit) continue
        if (Math.abs(this.rabbit.x - s.x) < 22 && Math.abs(this.rabbit.y - s.y) < 24) {
          s.hit = true
          s.hitAt = this.elapsed
          this.addScore(3)
          this.spawnParticles(s.x, s.y, '#ff8a80', 8)
          sounds.star()
          vibrate()
        }
      }

      const targetCam = this.rabbit.y - H * 0.45
      if (targetCam < this.camera) {
        this.camera += (targetCam - this.camera) * 0.18
      }

      this.ensureLayers()
      this.cleanupLayers()

      if (this.elapsed - this.lastStarClean > 2) {
        this.lastStarClean = this.elapsed
        this.stars = this.stars.filter((s) => !s.hit || this.elapsed - s.hitAt < 1)
      }

      this.updateParticles(dt)

      if (this.rabbit.y - this.camera > H + 60) {
        this.gameOver()
      }
    },

    hitBell(b) {
      b.scored = true
      b.hit = true
      b.hitAt = this.elapsed
      this.rabbit.y = b.y - RABBIT_R * 0.9
      let nearest = null
      for (const o of this.bells) {
        if (o.y < b.y && (!nearest || o.y > nearest.y)) nearest = o
      }
      const gap = nearest ? b.y - nearest.y : b.gapNext || this.nextGap()
      this.rabbit.vy = -Math.sqrt(2 * G * gap)
      const gain = b.gold ? 5 : 1
      this.addScore(gain)
      this.spawnParticles(b.x, b.y, b.gold ? '#ffd54f' : '#ffe082', 12)
      sounds.bell()
      vibrate()
    },

    addScore(n) {
      this.score += n
      scoreEl.textContent = this.score
    },

    spawnParticles(x, y, color, n) {
      for (let i = 0; i < n; i++) {
        const angle = Math.random() * Math.PI * 2
        const speed = 60 + Math.random() * 140
        this.particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 60,
          life: 0.6 + Math.random() * 0.3,
          maxLife: 0.9,
          color
        })
      }
    },

    updateParticles(dt) {
      for (let i = this.particles.length - 1; i >= 0; i--) {
        const p = this.particles[i]
        p.x += p.vx * dt
        p.y += p.vy * dt
        p.vy += 500 * dt
        p.life -= dt
        if (p.life <= 0) this.particles.splice(i, 1)
      }
    },

    cleanupLayers() {
      if (this.bells.length <= 12) return
      while (
        this.bells.length > 12 &&
        this.bells[this.bells.length - 1].y - this.camera > H + 150 &&
        this.bells[this.bells.length - 1].scored
      ) {
        this.bells.pop()
      }
    },

    gameOver() {
      this.state = 'gameover'
      this.touching = false
      if (this.score > this.best) {
        this.best = this.score
        saveBest(this.best)
      }
      sounds.fail()
      vibrate()
      this.updateUI()
    },

    startGame() {
      const startBell = this.bells[0]
      this.rabbit.vy = -Math.sqrt(2 * G * (startBell.gapNext || this.nextGap()))
      this.state = 'playing'
      sounds.bell()
      this.updateUI()
    },

    restart() {
      this.initGame()
      this.updateUI()
    },

    /* --- UI --- */
    updateUI() {
      bestEl.textContent = '最高 ' + this.best
      if (this.state === 'ready') {
        overlay.classList.remove('hidden')
        titleEl.textContent = '小兔跳铃铛'
        titleEl.classList.remove('over')
        btnEl.textContent = '点击开始'
        if (finalScoreEl) finalScoreEl.style.display = 'none'
        bestTipEl.textContent = this.best > 0 ? '历史最高 ' + this.best + ' 分' : ''
      } else if (this.state === 'gameover') {
        overlay.classList.remove('hidden')
        titleEl.textContent = '游戏结束'
        titleEl.classList.add('over')
        btnEl.textContent = '再来一局'
        finalScoreEl.textContent = '得分 ' + this.score
        finalScoreEl.style.display = ''
        bestTipEl.textContent = '历史最高 ' + this.best + ' 分'
      } else {
        overlay.classList.add('hidden')
      }
    },

    /* --- 渲染（与小程序一致） --- */
    render(t) {
      ctx.clearRect(0, 0, W, H)
      this.drawBackground(ctx, t)
      this.drawClouds(ctx, t)
      this.drawStars(ctx)
      this.drawBells(ctx, t)
      this.drawRabbit(ctx)
      this.drawParticles(ctx)
      this.drawGround(ctx)
    },

    drawBackground(ctx, t) {
      const grad = ctx.createLinearGradient(0, 0, 0, H)
      grad.addColorStop(0, '#0a0e2a')
      grad.addColorStop(0.55, '#201a4a')
      grad.addColorStop(1, '#3a2460')
      ctx.fillStyle = grad
      ctx.fillRect(0, 0, W, H)
      ctx.save()
      for (const s of this.bgStars) {
        const sy = (((s.y - this.camera) % (H * 4)) + H * 4) % (H * 4)
        if (sy > H) continue
        const alpha = 0.35 + 0.45 * (0.5 + 0.5 * Math.sin(t * 0.002 * s.speed + s.phase))
        ctx.globalAlpha = alpha
        ctx.fillStyle = '#ffffff'
        ctx.beginPath()
        ctx.arc(s.x, sy, s.r, 0, Math.PI * 2)
        ctx.fill()
      }
      ctx.restore()

      // 月亮（视差滚动，随上升缓慢下移）
      const mx = W * 0.82
      const my = H * 0.14 - this.camera * 0.12
      const mr = Math.min(W, H) * 0.075
      if (my > -mr * 2) {
        const halo = ctx.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 2.2)
        halo.addColorStop(0, 'rgba(255,240,190,0.35)')
        halo.addColorStop(1, 'rgba(255,240,190,0)')
        ctx.fillStyle = halo
        ctx.beginPath()
        ctx.arc(mx, my, mr * 2.2, 0, Math.PI * 2)
        ctx.fill()
        ctx.fillStyle = '#fff6d8'
        ctx.beginPath()
        ctx.arc(mx, my, mr, 0, Math.PI * 2)
        ctx.fill()
        ctx.fillStyle = 'rgba(240,220,180,0.6)'
        ctx.beginPath()
        ctx.arc(mx + mr * 0.25, my - mr * 0.2, mr * 0.18, 0, Math.PI * 2)
        ctx.arc(mx - mr * 0.3, my + mr * 0.35, mr * 0.13, 0, Math.PI * 2)
        ctx.fill()
      }
    },

    drawClouds(ctx, t) {
      for (const c of this.clouds) {
        c.x += c.speed * 0.016
        if (c.x > W + 120) c.x = -120
        if (c.x < -120) c.x = W + 120
        ctx.save()
        ctx.globalAlpha = 0.18
        ctx.fillStyle = '#ffffff'
        const s = c.s
        const baseY = c.y + Math.sin(t * 0.0004 + c.x) * 6
        ctx.beginPath()
        ctx.arc(c.x, baseY, 34 * s, 0, Math.PI * 2)
        ctx.arc(c.x - 30 * s, baseY + 6 * s, 24 * s, 0, Math.PI * 2)
        ctx.arc(c.x + 30 * s, baseY + 6 * s, 24 * s, 0, Math.PI * 2)
        ctx.fill()
        ctx.restore()
      }
    },

    drawStars(ctx) {
      for (const s of this.stars) {
        if (s.hit) {
          const dt = this.elapsed - s.hitAt
          if (dt > 0.6) continue
          ctx.globalAlpha = Math.max(0, 1 - dt * 1.6)
        } else {
          ctx.globalAlpha = 0.9
        }
        const sy = s.y - this.camera
        if (sy < -40 || sy > H + 40) {
          ctx.globalAlpha = 1
          continue
        }
        ctx.save()
        ctx.translate(s.x, sy)
        if (s.hit) ctx.scale(1 + (this.elapsed - s.hitAt) * 2, 1 + (this.elapsed - s.hitAt) * 2)
        ctx.fillStyle = '#ffd54f'
        ctx.beginPath()
        for (let i = 0; i < 5; i++) {
          const ang = -Math.PI / 2 + (i * 2 * Math.PI) / 5
          const px = Math.cos(ang) * s.r
          const py = Math.sin(ang) * s.r
          if (i === 0) ctx.moveTo(px, py)
          else ctx.lineTo(px, py)
          const ang2 = ang + Math.PI / 5
          ctx.lineTo(Math.cos(ang2) * s.r * 0.45, Math.sin(ang2) * s.r * 0.45)
        }
        ctx.closePath()
        ctx.fill()
        ctx.restore()
        ctx.globalAlpha = 1
      }
    },

    drawBells(ctx, t) {
      for (const b of this.bells) {
        const sy = b.y - this.camera
        if (sy < -80 || sy > H + 80) continue
        let scale = 1
        let alpha = 1
        if (b.hit) {
          const dt = (this.elapsed - b.hitAt) * 2.2
          scale = 1 + dt
          alpha = Math.max(0, 1 - dt)
          if (dt > 0.9) b.hit = false
        }
        ctx.save()
        ctx.globalAlpha = alpha * (b.scored ? 0.32 : 1)
        ctx.translate(b.x, sy)
        ctx.scale(scale, scale)

        if (b.gold && !b.scored) {
          const pulse = 0.5 + 0.5 * Math.sin(t * 0.006 + b.x)
          ctx.globalAlpha = alpha * (0.25 + 0.25 * pulse)
          ctx.strokeStyle = '#ffd54f'
          ctx.lineWidth = 2
          ctx.beginPath()
          ctx.arc(0, 0, b.r + 6, 0, Math.PI * 2)
          ctx.stroke()
          ctx.globalAlpha = alpha * (b.scored ? 0.32 : 1)
        }

        // 顶部系钮与挂环
        ctx.fillStyle = '#d9a441'
        ctx.beginPath()
        ctx.arc(0, -b.r * 1.24, b.r * 0.13, 0, Math.PI * 2)
        ctx.fill()
        ctx.strokeStyle = '#c9972f'
        ctx.lineWidth = 2.5
        ctx.beginPath()
        ctx.arc(0, -b.r * 1.05, b.r * 0.24, 0, Math.PI * 2)
        ctx.stroke()

        // 铃身（亮金色渐变）
        const grad = ctx.createRadialGradient(-b.r * 0.32, -b.r * 0.4, b.r * 0.15, 0, 0, b.r * 1.05)
        if (b.gold) {
          grad.addColorStop(0, '#fffbe6')
          grad.addColorStop(0.5, '#ffd54f')
          grad.addColorStop(1, '#f09a12')
        } else {
          grad.addColorStop(0, '#fff9e0')
          grad.addColorStop(0.5, '#ffe27a')
          grad.addColorStop(1, '#e2a413')
        }
        ctx.fillStyle = grad
        ctx.beginPath()
        ctx.arc(0, 0, b.r, 0, Math.PI * 2)
        ctx.fill()

        // 铃口（下方半圆延伸 + 暗部开口）
        ctx.fillStyle = grad
        ctx.beginPath()
        ctx.arc(0, b.r * 0.48, b.r * 0.66, 0, Math.PI)
        ctx.fill()
        ctx.fillStyle = 'rgba(190,120,20,0.35)'
        ctx.beginPath()
        ctx.arc(0, b.r * 0.56, b.r * 0.48, 0, Math.PI)
        ctx.fill()

        // 顶部高光与亮点
        ctx.fillStyle = 'rgba(255,255,255,0.65)'
        ctx.beginPath()
        ctx.ellipse(-b.r * 0.34, -b.r * 0.42, b.r * 0.3, b.r * 0.16, -0.5, 0, Math.PI * 2)
        ctx.fill()
        ctx.fillStyle = 'rgba(255,255,255,0.35)'
        ctx.beginPath()
        ctx.arc(-b.r * 0.05, -b.r * 0.52, b.r * 0.08, 0, Math.PI * 2)
        ctx.fill()

        // 底部阴影
        ctx.fillStyle = 'rgba(0,0,0,0.14)'
        ctx.beginPath()
        ctx.ellipse(0, b.r * 0.82, b.r * 0.78, b.r * 0.2, 0, 0, Math.PI * 2)
        ctx.fill()

        ctx.restore()
        ctx.globalAlpha = 1
      }
    },

    drawRabbit(ctx) {
      const r = RABBIT_R
      const x = this.rabbit.x
      const y = this.rabbit.y - this.camera
      const tilt = clamp(this.rabbit.vx * 0.02, -0.42, 0.42)
      const t = this.elapsed
      ctx.save()
      ctx.translate(x, y)
      ctx.rotate(tilt)

      // 脚下柔和阴影
      ctx.fillStyle = 'rgba(0,0,0,0.12)'
      ctx.beginPath()
      ctx.ellipse(0, r * 1.12, r * 0.85, r * 0.2, 0, 0, Math.PI * 2)
      ctx.fill()

      // 尾巴
      ctx.fillStyle = '#f6f6f6'
      ctx.beginPath()
      ctx.arc(r * 0.8, r * 0.6, r * 0.3, 0, Math.PI * 2)
      ctx.fill()

      // 耳朵（弹簧摆动）
      const earSwing = Math.sin(t * 5) * 0.1
      this.drawEar(ctx, -r * 0.42, -r * 0.6, -0.3 + earSwing, r)
      this.drawEar(ctx, r * 0.42, -r * 0.6, 0.3 - earSwing, r)

      // 小短手
      ctx.fillStyle = '#fdf3ea'
      ctx.beginPath()
      ctx.ellipse(-r * 0.95, r * 0.22, r * 0.22, r * 0.3, 0.5, 0, Math.PI * 2)
      ctx.ellipse(r * 0.95, r * 0.22, r * 0.22, r * 0.3, -0.5, 0, Math.PI * 2)
      ctx.fill()

      // 身体（米白渐变，圆鼓鼓）
      const bodyGrad = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.2, 0, 0, r * 1.1)
      bodyGrad.addColorStop(0, '#ffffff')
      bodyGrad.addColorStop(0.7, '#fdf6ec')
      bodyGrad.addColorStop(1, '#f6e7d3')
      ctx.fillStyle = bodyGrad
      ctx.beginPath()
      ctx.ellipse(0, 0, r, r * 1.08, 0, 0, Math.PI * 2)
      ctx.fill()
      ctx.strokeStyle = 'rgba(214,178,135,0.25)'
      ctx.lineWidth = 1
      ctx.stroke()

      // 肚子
      ctx.fillStyle = 'rgba(255,255,255,0.65)'
      ctx.beginPath()
      ctx.ellipse(0, r * 0.35, r * 0.55, r * 0.5, 0, 0, Math.PI * 2)
      ctx.fill()

      // 腮红
      ctx.fillStyle = 'rgba(255,150,140,0.5)'
      ctx.beginPath()
      ctx.ellipse(-r * 0.62, r * 0.18, r * 0.24, r * 0.15, 0, 0, Math.PI * 2)
      ctx.ellipse(r * 0.62, r * 0.18, r * 0.24, r * 0.15, 0, 0, Math.PI * 2)
      ctx.fill()

      // 眼睛（大而 Q，深棕，双高光）
      ctx.fillStyle = '#4a2f2a'
      ctx.beginPath()
      ctx.arc(-r * 0.34, -r * 0.22, r * 0.19, 0, Math.PI * 2)
      ctx.arc(r * 0.34, -r * 0.22, r * 0.19, 0, Math.PI * 2)
      ctx.fill()
      ctx.fillStyle = '#ffffff'
      ctx.beginPath()
      ctx.arc(-r * 0.29, -r * 0.28, r * 0.07, 0, Math.PI * 2)
      ctx.arc(r * 0.39, -r * 0.28, r * 0.07, 0, Math.PI * 2)
      ctx.fill()
      ctx.fillStyle = 'rgba(255,255,255,0.55)'
      ctx.beginPath()
      ctx.arc(-r * 0.4, -r * 0.16, r * 0.035, 0, Math.PI * 2)
      ctx.arc(r * 0.28, -r * 0.16, r * 0.035, 0, Math.PI * 2)
      ctx.fill()

      // 鼻子和嘴
      ctx.fillStyle = '#ff8a80'
      ctx.beginPath()
      ctx.moveTo(0, -r * 0.06)
      ctx.quadraticCurveTo(r * 0.08, r * 0.04, 0, r * 0.1)
      ctx.quadraticCurveTo(-r * 0.08, r * 0.04, 0, -r * 0.06)
      ctx.fill()
      ctx.strokeStyle = 'rgba(224,160,160,0.8)'
      ctx.lineWidth = 1
      ctx.beginPath()
      ctx.moveTo(0, r * 0.12)
      ctx.quadraticCurveTo(-r * 0.1, r * 0.24, -r * 0.2, r * 0.3)
      ctx.moveTo(0, r * 0.12)
      ctx.quadraticCurveTo(r * 0.1, r * 0.24, r * 0.2, r * 0.3)
      ctx.stroke()

      ctx.restore()
    },

    drawEar(ctx, x, y, angle, r) {
      ctx.save()
      ctx.translate(x, y)
      ctx.rotate(angle)
      // 耳外侧（米白）
      const earGrad = ctx.createLinearGradient(0, -r * 0.7, 0, r * 0.3)
      earGrad.addColorStop(0, '#fffaf2')
      earGrad.addColorStop(1, '#fdece0')
      ctx.fillStyle = earGrad
      ctx.beginPath()
      ctx.ellipse(0, -r * 0.42, r * 0.26, r * 0.62, 0, 0, Math.PI * 2)
      ctx.fill()
      // 耳内侧（粉渐变）
      const innerGrad = ctx.createLinearGradient(0, -r * 0.55, 0, r * 0.1)
      innerGrad.addColorStop(0, '#ffc9c9')
      innerGrad.addColorStop(1, '#ff9e9e')
      ctx.fillStyle = innerGrad
      ctx.beginPath()
      ctx.ellipse(0, -r * 0.4, r * 0.13, r * 0.38, 0, 0, Math.PI * 2)
      ctx.fill()
      ctx.restore()
    },

    drawParticles(ctx) {
      for (const p of this.particles) {
        const alpha = Math.max(0, p.life / p.maxLife)
        ctx.globalAlpha = alpha
        ctx.fillStyle = p.color
        ctx.beginPath()
        ctx.arc(p.x, p.y - this.camera, 3 + alpha * 3, 0, Math.PI * 2)
        ctx.fill()
      }
      ctx.globalAlpha = 1
    },

    drawGround(ctx) {
      const gy = H - 46
      // 远景雪丘（浅蓝白，半透明）
      ctx.fillStyle = 'rgba(255,255,255,0.5)'
      ctx.beginPath()
      ctx.moveTo(0, gy + 14)
      ctx.quadraticCurveTo(W * 0.25, gy - 26, W * 0.5, gy - 8)
      ctx.quadraticCurveTo(W * 0.78, gy + 8, W, gy - 12)
      ctx.lineTo(W, H)
      ctx.lineTo(0, H)
      ctx.closePath()
      ctx.fill()
      // 近景雪地（暖白渐变）
      const grad = ctx.createLinearGradient(0, gy - 30, 0, H)
      grad.addColorStop(0, 'rgba(255,255,255,0.98)')
      grad.addColorStop(1, 'rgba(224,232,244,1)')
      ctx.fillStyle = grad
      ctx.beginPath()
      ctx.moveTo(0, gy)
      ctx.quadraticCurveTo(W * 0.3, gy - 18, W * 0.55, gy - 6)
      ctx.quadraticCurveTo(W * 0.8, gy + 4, W, gy - 10)
      ctx.lineTo(W, H)
      ctx.lineTo(0, H)
      ctx.closePath()
      ctx.fill()
    }
  }

  /* ================= 输入（触摸 + 鼠标） ================= */
  function handleDown(x) {
    ensureAudio()
    if (game.state === 'ready') {
      game.touchX = x
      game.startGame()
    }
    if (game.state === 'playing') {
      game.touching = true
      game.touchX = x
    }
  }
  function handleMove(x) {
    if (game.state === 'playing') {
      // 桌面端：鼠标悬停在画布内即控制，无需按住；触摸端手指移动同样走这里
      game.touching = true
      game.touchX = x
    }
  }
  function handleUp() {
    game.touching = false
  }

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault()
    const t = e.touches[0]
    if (t) handleDown(t.clientX)
  }, { passive: false })
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault()
    const t = e.touches[0]
    if (t) handleMove(t.clientX)
  }, { passive: false })
  canvas.addEventListener('touchend', (e) => {
    e.preventDefault()
    handleUp()
  }, { passive: false })
  canvas.addEventListener('mousedown', (e) => handleDown(e.clientX))
  canvas.addEventListener('mousemove', (e) => handleMove(e.clientX))
  canvas.addEventListener('mouseleave', () => handleUp())
  window.addEventListener('mouseup', () => handleUp())

  overlay.addEventListener('click', () => {
    ensureAudio()
    if (game.state === 'ready') game.startGame()
    else if (game.state === 'gameover') game.restart()
  })

  /* ================= 启动 ================= */
  game.initGame()
  game.updateUI()
  // 暴露调试句柄（不影响游戏，便于自动化验证）
  window.__game = game
  // 支持 ?auto=1 自动开局（便于试玩分享 / 自动验证）
  if (/[?&]auto=1/.test(location.search)) {
    game.touchX = W / 2
    game.startGame()
  }
  game.start()
})()
</script>
